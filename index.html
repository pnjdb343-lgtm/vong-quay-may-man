
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vòng Quay May Mắn</title>
</head>
<body style="margin:0;padding:0;">

<!-- 
  VÒNG QUAY MAY MẮN - Phong cách hội chợ - NẠP DANH MỤC QUÀ ĐỘNG TỪ EXCEL
  ==========================================================================
  CÁCH DÙNG:
  1. Tìm dòng "const FLOW_URL = ..." bên dưới, thay bằng URL Flow quay thưởng (Power Automate).
  2. Tìm dòng "const DANH_MUC_URL = ..." bên dưới, thay bằng URL Flow "LayDanhMucQuaTang" (lấy danh sách quà từ Excel).
  3. KHÔNG cần sửa tên/số lượng quà trong file này nữa — chỉ cần admin sửa trực tiếp trong Excel (sheet DanhMuc),
     vòng quay sẽ tự động cập nhật đúng theo Excel mỗi khi có người mở trang.
  4. Nếu dùng làm trang GitHub Pages độc lập: giữ nguyên toàn bộ (đã có sẵn thẻ html/head/body).
     Nếu dán vào Web Part "Embed" của SharePoint: chỉ cần dán từ thẻ <div id="vqmm-root"> trở xuống, bỏ qua phần <html><head><body>.
-->

<div id="vqmm-root">
  <div class="vqmm-container">
    <p class="vqmm-eyebrow">TỎA SÁNG PHONG CÁCH</p>
    <p class="vqmm-tagline">TRANG SỨC CHO BẢN LĨNH XỨNG TẦM</p>
    <h1 class="vqmm-title">VÒNG QUAY MAY MẮN</h1>

    <!-- FORM NHẬP THÔNG TIN -->
    <div id="vqmm-form-box" class="vqmm-card">
      <label class="vqmm-label">Họ và tên</label>
      <input id="vqmm-hoten" class="vqmm-input" type="text" placeholder="Nhập họ tên của bạn" />
      <label class="vqmm-label">Số điện thoại</label>
      <input id="vqmm-sdt" class="vqmm-input" type="tel" placeholder="Nhập số điện thoại" />

      <label class="vqmm-consent">
        <input id="vqmm-dongy" type="checkbox" />
        <span>Tôi đồng ý cho PNJ thu thập, xử lý dữ liệu cá nhân của tôi theo quy định tại Thông báo này và theo quy định của pháp luật.</span>
      </label>

      <button id="vqmm-btn-batdau" class="vqmm-btn">Bắt đầu quay 🎯</button>
      <p id="vqmm-error" class="vqmm-error"></p>
    </div>

    <!-- VÒNG QUAY -->
    <div id="vqmm-wheel-box" class="vqmm-card" style="display:none;">
      <div class="vqmm-wheel-wrap">
        <div class="vqmm-pointer">▼</div>
        <canvas id="vqmm-canvas" width="360" height="360"></canvas>
      </div>
      <button id="vqmm-btn-quay" class="vqmm-btn vqmm-btn-quay" disabled>Đang tải quà...</button>
      <p id="vqmm-status" class="vqmm-status"></p>
    </div>

    <!-- KẾT QUẢ -->
    <div id="vqmm-result-overlay" class="vqmm-overlay" style="display:none;">
      <div class="vqmm-result-box">
        <div class="vqmm-confetti">✦</div>
        <h2 id="vqmm-result-title">Chúc mừng bạn đã trúng!</h2>
        <p id="vqmm-result-text" class="vqmm-result-text"></p>
        <p id="vqmm-result-code" class="vqmm-result-code"></p>
        <button id="vqmm-btn-dong" class="vqmm-btn">Đóng</button>
      </div>
    </div>
  </div>
</div>

<style>
  html, body {
    width: 100%;
    min-height: 100%;
    background: radial-gradient(ellipse at top, #16244a 0%, #0a1128 60%, #060a1a 100%);
  }

  #vqmm-root {
    --vqmm-navy-1: #24406e;
    --vqmm-navy-2: #1c3157;
    --vqmm-navy-3: #14264a;
    --vqmm-navy-4: #2c4b7f;
    --vqmm-navy-5: #1a2f57;
    --vqmm-gold: #d9b774;
    --vqmm-gold-light: #f3e2b8;
    --vqmm-dark: #0a1128;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #16244a 0%, #0a1128 60%, #060a1a 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 12px;
    box-sizing: border-box;
  }
  #vqmm-root * { box-sizing: border-box; }

  .vqmm-container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .vqmm-eyebrow {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
  }

  .vqmm-tagline {
    margin: 4px 0 18px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--vqmm-gold);
    text-transform: uppercase;
  }

  .vqmm-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--vqmm-gold-light);
    margin: 0 0 28px;
    text-transform: uppercase;
  }

  .vqmm-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(217,183,116,0.35);
    border-radius: 20px;
    padding: 24px 20px;
    backdrop-filter: blur(4px);
  }

  .vqmm-label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--vqmm-gold-light);
    margin: 12px 0 6px;
  }

  .vqmm-input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(217,183,116,0.4);
    border-radius: 12px;
    font-size: 15px;

  }
  .vqmm-input::placeholder { color: rgba(255,255,255,0.4); }
  .vqmm-input:focus { border-color: var(--vqmm-gold); }

  .vqmm-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: 1.5px solid var(--vqmm-gold);
    border-radius: 999px;

    text-transform: uppercase;

  }
  .vqmm-btn:hover { background: rgba(217,183,116,0.12); }
  .vqmm-btn:active { transform: scale(0.97); }

    font-size: 16px;
  }

  .vqmm-consent {
    display: flex;

  .vqmm-consent input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;

  }

  .vqmm-consent span {

  .vqmm-error {

  }

  .vqmm-wheel-wrap {
    position: relative;
    width: 360px;
    max-width: 100%;

  }

  .vqmm-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    color: var(--vqmm-gold-light);
    z-index: 5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  #vqmm-canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--vqmm-dark), 0 0 0 6px var(--vqmm-gold), 0 10px 40px rgba(0,0,0,0.5);
  }

  .vqmm-status {
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--vqmm-gold-light);
    min-height: 20px;
  }

  .vqmm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6,10,26,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }

  .vqmm-result-box {
    background: linear-gradient(160deg, #1c3157 0%, #0a1128 100%);
    border: 1px solid var(--vqmm-gold);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    animation: vqmm-pop 0.35s ease;
  }

  @keyframes vqmm-pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .vqmm-confetti {
    font-size: 40px;
    margin-bottom: 8px;
    color: var(--vqmm-gold);
  }

  #vqmm-result-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--vqmm-gold-light);
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  .vqmm-result-text {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin: 0 0 6px;
  }

  .vqmm-result-code {
    font-size: 15px;
    font-weight: 600;
    color: var(--vqmm-gold-light);
    background: rgba(217,183,116,0.12);
    border: 1px solid rgba(217,183,116,0.3);
    padding: 8px 12px;
    border-radius: 10px;
    margin: 0 0 8px;
  }
</style>

<script>
(function () {
  // ============ CẤU HÌNH — CHỈNH LẠI CHO ĐÚNG VỚI DỰ ÁN CỦA BẠN ============

    // Thay URL này bằng URL HTTP trigger thật của Power Automate Flow (quay thưởng)
  const FLOW_URL = "https://default6ea838f0f529455e9738147060990b.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/19/workflows/853b0f555662457682bd6e7d613d7694/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=peqm4gi5K02SNX3gTgju3tArB0DgcWpBpFnquwdXr4U";

  // Thay URL này bằng URL Flow "LayDanhMucQuaTang" (lấy danh sách quà mới nhất từ Excel)
  const DANH_MUC_URL = "https://default6ea838f0f529455e9738147060990b.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/00/workflows/507e4a47292f4d8bb87c8d7c2bda1628/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YnzBPjVpJQHLdprUu9Y9IDgbEcN2ws-YekcMh0EwZ6c";

  // Bảng màu gán tự động theo thứ tự ViTri — tông navy xen kẽ, đồng bộ với theme sang trọng
  const BANG_MAU = ["#24406e", "#1a2f57", "#2c4b7f", "#14264a", "#2c4b7f", "#1a2f57", "#24406e", "#14264a"];

  // PRIZES sẽ được nạp động từ Excel khi trang tải lên (xem hàm napDanhMucQua bên dưới)
  let PRIZES = [];

  // ==========================================================================

  const canvas = document.getElementById("vqmm-canvas");
  const ctx = canvas.getContext("2d");
  const radius = canvas.width / 2;
  function getSliceAngle() { return (2 * Math.PI) / PRIZES.length; }
  let currentRotation = 0;

  // Tự động xuống dòng: bẻ chuỗi thành nhiều dòng sao cho mỗi dòng không vượt quá maxWidth (px)
  function wrapLabel(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let current = "";
    words.forEach((word) => {
      const test = current ? current + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function drawWheel(rotation) {
    const sliceAngle = getSliceAngle();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(rotation);

    // Vùng chữ khả dụng từ tâm ra viền (trừ khoảng trống ở tâm và lề ngoài)
    const zoneInner = 46;
    const zoneOuter = radius - 20;
    const textZoneWidth = zoneOuter - zoneInner;
    const zoneMid = (zoneInner + zoneOuter) / 2;

    PRIZES.forEach((prize, i) => {
      const startAngle = i * sliceAngle;
      const endAngle = startAngle + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius - 6, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = prize.color;
      ctx.fill();
      ctx.strokeStyle = "#d9b774";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Text
      ctx.save();
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f3e2b8";
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur = 3;

      // Thử cỡ chữ giảm dần nếu chữ vẫn quá 3 dòng ở cỡ mặc định
      let fontSize = 13;
      let lines = [];
      while (fontSize >= 9) {
        ctx.font = "bold " + fontSize + "px Segoe UI, sans-serif";
        lines = wrapLabel(ctx, prize.label, textZoneWidth);
        if (lines.length <= 3) break;
        fontSize -= 1;
      }
      ctx.font = "bold " + fontSize + "px Segoe UI, sans-serif";
      const lineHeight = fontSize + 5;
      lines.forEach((line, idx) => {
        ctx.fillText(line, zoneMid, (idx - (lines.length - 1) / 2) * lineHeight + fontSize / 2);
      });
      ctx.restore();
    });

    // Tâm vòng quay
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, 2 * Math.PI);
    ctx.fillStyle = "#0a1128";
    ctx.fill();
    ctx.strokeStyle = "#d9b774";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.restore();
  }

  // Nạp danh sách quà mới nhất từ Excel (qua Flow LayDanhMucQuaTang) mỗi khi trang được mở
  async function napDanhMucQua() {
    try {
      const res = await fetch(DANH_MUC_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      const rows = await res.json();
      // Sắp xếp đúng theo ViTri, gán màu tự động theo bảng màu cố định
      const sorted = rows.slice().sort((a, b) => Number(a.ViTri) - Number(b.ViTri));
      PRIZES = sorted.map((row, i) => ({
        label: String(row.LoaiThuong).trim(),
        color: BANG_MAU[i % BANG_MAU.length]
      }));
      drawWheel(0);
      btnQuay.disabled = false;
      btnQuay.textContent = "QUAY NGAY!";
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "Không tải được danh sách quà. Vui lòng tải lại trang.";
    }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // Quay animation tới đúng viTriTrung (0..3) mà server đã chọn
  function spinToIndex(viTriTrung, onDone) {
    const sliceAngle = getSliceAngle();
    const targetSliceCenter = viTriTrung * sliceAngle + sliceAngle / 2;
    // con trỏ chỉ ở góc -90deg (đỉnh), nên cần bù lại
    const pointerAngle = -Math.PI / 2;
    const extraSpins = 6; // số vòng quay thêm cho đẹp mắt
    const finalRotation =
      currentRotation +
      extraSpins * 2 * Math.PI +
      (pointerAngle - targetSliceCenter - (currentRotation % (2 * Math.PI)));

    const duration = 4500;
    const startTime = performance.now();
    const startRotation = currentRotation;
    const rotationDelta = finalRotation - startRotation;

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(t);
      currentRotation = startRotation + rotationDelta * eased;
      drawWheel(currentRotation);

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        currentRotation = finalRotation;
        onDone();
      }
    }
    requestAnimationFrame(animate);
  }

  // ============ LOGIC FORM & GỌI FLOW ============

  const formBox = document.getElementById("vqmm-form-box");
  const wheelBox = document.getElementById("vqmm-wheel-box");
  const hoTenInput = document.getElementById("vqmm-hoten");
  const sdtInput = document.getElementById("vqmm-sdt");
  const dongYInput = document.getElementById("vqmm-dongy");
  const errorEl = document.getElementById("vqmm-error");
  const statusEl = document.getElementById("vqmm-status");
  const btnBatDau = document.getElementById("vqmm-btn-batdau");
  const btnQuay = document.getElementById("vqmm-btn-quay");
  const btnDong = document.getElementById("vqmm-btn-dong");
  const overlay = document.getElementById("vqmm-result-overlay");
  const resultText = document.getElementById("vqmm-result-text");
  const resultCode = document.getElementById("vqmm-result-code");

  let hoTen = "", sdt = "";

  btnBatDau.addEventListener("click", function () {
    hoTen = hoTenInput.value.trim();
    sdt = sdtInput.value.trim();
    errorEl.textContent = "";

    if (!hoTen) { errorEl.textContent = "Vui lòng nhập họ tên."; return; }
    if (!/^[0-9]{9,11}$/.test(sdt)) { errorEl.textContent = "Số điện thoại không hợp lệ."; return; }
    if (!dongYInput.checked) { errorEl.textContent = "Vui lòng đồng ý điều khoản thu thập dữ liệu cá nhân để tiếp tục."; return; }

    formBox.style.display = "none";
    wheelBox.style.display = "block";
  });

  btnQuay.addEventListener("click", async function () {
    btnQuay.disabled = true;
    statusEl.textContent = "Đang quay, vui lòng chờ...";

    try {
      const res = await fetch(FLOW_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ HoTen: hoTen, SDT: sdt })
      });
      const data = await res.json();

      if (!data.ThanhCong) {
        statusEl.textContent = data.Message || "Có lỗi xảy ra, vui lòng thử lại.";
        btnQuay.disabled = false;
        return;
      }

      spinToIndex(data.ViTriTrung, function () {
        const prize = PRIZES[data.ViTriTrung];
        resultText.textContent = (data.KetQua || prize.label.replace("\n", " "));
        resultCode.style.display = "none";
        overlay.style.display = "flex";
        statusEl.textContent = "";
      });
    } catch (err) {
      statusEl.textContent = "Không thể kết nối máy chủ. Vui lòng thử lại sau.";
      btnQuay.disabled = false;
    }
  });

  btnDong.addEventListener("click", function () {
    overlay.style.display = "none";
    btnQuay.disabled = true;
    btnQuay.textContent = "Đã quay";
  });

  // Nạp danh mục quà ngay khi trang vừa tải lên
  napDanhMucQua();
})();
</script>

</body>
